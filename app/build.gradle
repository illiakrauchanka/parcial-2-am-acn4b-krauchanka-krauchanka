import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

// Release keystore credentials live outside the repo (parcial2-planning/keystore.properties)
// and are never committed. When absent, the release variant falls back to the debug
// signing key so the build still works locally for testing.
File keystoreProps = rootProject.file('keystore.properties')
Properties ks = new Properties()
if (keystoreProps.exists()) {
    ks.load(new FileInputStream(keystoreProps))
}

android {
    namespace 'com.davinci.medtraveler'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.davinci.medtraveler"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (ks.containsKey('storeFile')) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Keep R8 off for the first Play submission to avoid stripped-symbol crashes;
            // enable later once keep rules are validated. See proguard-rules.pro.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ks.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.play.services.auth
    implementation libs.glide
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.okhttp
    testImplementation libs.junit
    testImplementation libs.org.json
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
